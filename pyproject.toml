[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vineyard_wind"  # Replace with your desired project name
version = "0.0.1"
description = "A local Python package for project imports"
authors = [
    { name = "William F. Jenkins", email = "wfjenkins@ucsd.edu" }
]
dependencies = [
    "adaptfilt",
    "basemap",
    "bathyreq",
    "cmasher",
    "cmocean",
    "dascore",
    "emd",
    "h5py",
    "ipympl",
    "juliacall",
    "jupyterlab",
    "matplotlib",
    "netcdf4",
    "numpy",
    "pandas",
    "polars",
    "pymap3d",
    "pyproj",
    "python-dotenv",
    "PyWavelets",
    "scipy",
    "seaborn",
    "tqdm",
    "rodeo",
    "TritonOA",
]
requires-python = ">= 3.12"

[tool.uv.sources]
rodeo = { path = "../core", editable = true }
TritonOA = { git = "ssh://git@github.com/TritonOA/TritonOA.git" }

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src"]